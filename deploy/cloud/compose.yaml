name: onsori-pilot
services:
  gateway:
    build:
      context: ../..
      dockerfile: deploy/cloud/Dockerfile
    env_file: .env
    environment:
      ONSORI_DATA_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - gateway_data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=96m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
      - --web.listen-address=0.0.0.0:9090
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./secrets/metrics_token:/run/secrets/metrics_token:ro,Z
      - prometheus_data:/prometheus
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
volumes:
  gateway_data:
  prometheus_data:
