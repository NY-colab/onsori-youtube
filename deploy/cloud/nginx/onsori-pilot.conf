# /etc/nginx/conf.d/onsori-pilot.conf — OnSori pilot on NAVER Cloud (approved 2026-11-02).
# Host name: sslip.io maps 211-233-192-122.sslip.io to the server's public IP.
# Certificate: Let's Encrypt via certbot webroot; renewal by certbot-renew.timer.
# Gateway (8000) and Prometheus (9090) stay on loopback; only the paths below are proxied.
limit_req_zone $binary_remote_addr zone=onsori:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=onsori_issue:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=onsori_conn:10m;

server {
    listen 80;
    server_name 211-233-192-122.sslip.io;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.24 has no separate http2 directive (1.25.1+).
    listen 443 ssl http2;
    server_name 211-233-192-122.sslip.io;
    ssl_certificate /etc/letsencrypt/live/211-233-192-122.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/211-233-192-122.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:onsori_tls:1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 42m;
    client_body_timeout 30s;
    send_timeout 30s;

    location = /metrics { return 404; }
    location ^~ /metrics/ { return 404; }

    # Public minimal liveness only.
    location = /healthz {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8000;
    }

    # Extension routes (2026-11-04): open to any address. The gateway issues one
    # key per install (capped per address per day), scopes jobs to that key and
    # enforces per-install and server daily audio limits. CORS comes from the gateway.
    location = /v1/availability {
        limit_except GET { deny all; }
        limit_req zone=onsori burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location = /v1/installs {
        limit_except POST OPTIONS { deny all; }
        limit_req zone=onsori_issue burst=3 nodelay;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:8000;
    }
    # Caption typo correction (2026-11-13): small JSON of caption text, install key required;
    # the gateway enforces per-install and server daily line limits.
    location = /v1/corrections {
        limit_except POST OPTIONS { deny all; }
        limit_conn onsori_conn 4;
        limit_req zone=onsori burst=10 nodelay;
        client_max_body_size 128k;
        proxy_read_timeout 130s;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://127.0.0.1:8000;
    }
    location ^~ /v1/jobs {
        limit_except GET POST DELETE OPTIONS { deny all; }
        limit_conn onsori_conn 4;
        limit_req zone=onsori burst=10 nodelay;
        proxy_read_timeout 130s;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://127.0.0.1:8000;
    }

    # Operator API: n8n's fixed egress address only (aitestbed support reply, 2026-11-03),
    # read-only.
    location ^~ /v1/ {
        allow 180.210.76.21;
        deny all;
        limit_except GET { deny all; }
        limit_conn onsori_conn 2;
        limit_req zone=onsori burst=10 nodelay;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://127.0.0.1:8000;
    }

    # Grafana data source: Prometheus read endpoints only, behind basic auth and the
    # Grafana egress allowlist in /etc/nginx/onsori-grafana-allow.conf (deny all until known).
    location ^~ /prometheus/ {
        include /etc/nginx/onsori-grafana-allow.conf;
        deny all;
        auth_basic "OnSori Prometheus";
        auth_basic_user_file /etc/nginx/onsori-prometheus.htpasswd;
        limit_req zone=onsori burst=20 nodelay;
        location ~ ^/prometheus/api/v1/(query|query_range|query_exemplars|series|labels|label/[A-Za-z0-9_]+/values|metadata|status/buildinfo)$ {
            limit_except GET POST { deny all; }
            rewrite ^/prometheus/(.*)$ /$1 break;
            proxy_read_timeout 30s;
            proxy_set_header Authorization "";
            proxy_pass http://127.0.0.1:9090;
        }
        return 404;
    }

    location / { return 404; }
}
