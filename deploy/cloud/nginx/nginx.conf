# /etc/nginx/nginx.conf on the OnSori pilot host (Rocky Linux 8, nginx 1.24).
# Replaces the package default so the stock welcome page is never served.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
include /usr/share/nginx/modules/*.conf;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # No request bodies, headers or credentials in the log; query strings stay out too.
    log_format onsori '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log onsori;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
        return 444;
    }
    include /etc/nginx/conf.d/*.conf;
}
